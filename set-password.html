<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Your Password | Oakwood Marketing</title>
  <meta name="description" content="Set a password for the Oakwood Marketing client portal.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=88">
  <link rel="stylesheet" href="css/portal.css?v=3">
</head>
<body>

  <header class="site-header">
    <div class="container portal-bar nav">
      <a href="index.html" class="brand">
        <img src="assets/logo.svg" alt="Oakwood Marketing logo" class="logo-mark">
        Oakwood Marketing
      </a>
    </div>
  </header>

  <div class="auth-screen">
    <div class="auth-card">
      <h1 id="title">Set your password</h1>
      <p class="sub" id="sub">Pick something you don't use anywhere else. At least 8 characters.</p>

      <form id="form" hidden>
        <div class="form-group">
          <label for="pw1">New password</label>
          <input type="password" id="pw1" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="form-group">
          <label for="pw2">Confirm password</label>
          <input type="password" id="pw2" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save password</button>
      </form>

      <p class="auth-msg" id="msg" hidden></p>
      <p class="auth-links" id="backLink" hidden>
        <a href="login.html">Back to sign in</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { supabase, currentSession, PAGES } from './js/portal-auth.js';

    const $ = (id) => document.getElementById(id);
    const msg = $('msg');
    function say(text, ok) {
      msg.textContent = text;
      msg.className = 'auth-msg ' + (ok ? 'ok' : 'bad');
      msg.hidden = false;
    }

    // Invite and reset links both arrive with a token in the URL fragment, which
    // the library trades for a session as the page loads. No session here means
    // the link was already used, expired, or someone opened this page directly.
    const linkType = new URLSearchParams(location.hash.slice(1)).get('type');
    const session = await currentSession();

    if (!session) {
      $('title').textContent = 'This link has expired';
      $('sub').textContent =
        'Password links can only be used once, and they run out after a while. Ask us for a fresh invite, or use "Forgot your password?" on the sign-in page.';
      $('backLink').hidden = false;
    } else {
      if (linkType === 'recovery') $('title').textContent = 'Choose a new password';
      $('form').hidden = false;
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if ($('pw1').value !== $('pw2').value) {
        say('The two passwords do not match.', false);
        return;
      }
      $('saveBtn').disabled = true;
      const { error } = await supabase.auth.updateUser({ password: $('pw1').value });
      $('saveBtn').disabled = false;
      if (error) {
        say(error.message, false);
        return;
      }
      // Drop the token out of the address bar so a refresh or a shared link
      // cannot bring anyone back to this screen.
      history.replaceState(null, '', location.pathname);
      location.href = PAGES.portal;
    });
  </script>

</body>
</html>
