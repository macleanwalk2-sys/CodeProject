<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Oakwood oak tree logo">
  <!-- White version of logo.svg, for use on green or any dark ground. Same
       geometry, so the two marks stay identical if either is ever redrawn. -->
  <g fill="#ffffff">
    <!-- Rounded, symmetrical oak canopy built from lobes (mirrored about the center) -->
    <circle cx="50" cy="38" r="26"/>
    <circle cx="50" cy="18" r="14"/>
    <circle cx="28" cy="26" r="15"/>
    <circle cx="72" cy="26" r="15"/>
    <circle cx="20" cy="44" r="15"/>
    <circle cx="80" cy="44" r="15"/>
    <circle cx="30" cy="58" r="14"/>
    <circle cx="70" cy="58" r="14"/>
    <circle cx="50" cy="58" r="16"/>
    <!-- Trunk, symmetric and gently flared at the base -->
    <polygon points="45,54 55,54 57,92 43,92"/>
  </g>
</svg>
