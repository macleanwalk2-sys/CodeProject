<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Oakwood Marketing">
  <!-- Solid green tile with a white tree: at 16px a filled shape on a filled
       background stays readable, where a bare outline would disappear and would
       also vanish against a dark browser theme. -->
