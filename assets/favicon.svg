  <g fill="#ffffff" transform="translate(50 52) scale(0.78) translate(-50 -50)">
    <circle cx="50" cy="38" r="26"/>
    <circle cx="50" cy="18" r="14"/>
    <circle cx="28" cy="26" r="15"/>
    <circle cx="72" cy="26" r="15"/>
    <circle cx="20" cy="44" r="15"/>
    <circle cx="80" cy="44" r="15"/>
    <circle cx="30" cy="58" r="14"/>
    <circle cx="70" cy="58" r="14"/>
    <circle cx="50" cy="58" r="16"/>
    <polygon points="45,54 55,54 57,92 43,92"/>
  </g>
</svg>
