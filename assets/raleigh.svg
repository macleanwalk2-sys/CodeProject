<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Low poly illustration of the downtown Raleigh, North Carolina skyline seen from the south, framed by trees">

  <!-- ===== Sky ===== -->
  <rect width="800" height="500" fill="#f4fbf7"/>
  <polygon points="0,0 340,0 0,180" fill="#e8f5ee"/>
  <polygon points="340,0 800,0 800,112 560,60" fill="#e2f1e8"/>
  <polygon points="0,180 340,0 540,148 0,300" fill="#eff8f3"/>
  <polygon points="800,112 800,272 560,158" fill="#dfeee5"/>
  <polygon points="640,44 694,76 694,140 640,172 586,140 586,76" fill="#d7ede2"/>
  <polygon points="640,66 676,88 676,130 640,152 604,130 604,88" fill="#c6e5d4"/>

  <!-- ===== Towers, back to front ===== -->

  <!-- far left low-rise -->
  <polygon points="118,344 118,270 146,264 146,344" fill="#57bb8c"/>
  <polygon points="146,344 146,264 174,278 174,344" fill="#3fa172"/>
  <polygon points="176,344 176,246 200,241 200,344" fill="#4aad7e"/>
  <polygon points="200,344 200,241 224,254 224,344" fill="#2f8f60"/>

  <!-- Wells Fargo Capitol Center: needle spire over a pyramid cap -->
  <polygon points="236,58 238,116 234,116" fill="#124e31"/>
  <polygon points="212,152 236,114 236,152" fill="#6cc49c"/>
  <polygon points="236,114 260,152 236,152" fill="#2f8f60"/>
  <polygon points="212,344 212,152 236,146 236,344" fill="#4aad7e"/>
  <polygon points="236,344 236,146 260,160 260,344" fill="#1f7a4d"/>

  <polygon points="266,344 266,208 288,203 288,344" fill="#3fa172"/>
  <polygon points="288,344 288,203 310,216 310,344" fill="#27865a"/>

  <!-- PNC Plaza: tallest, twin crown -->
  <polygon points="322,104 330,68 338,104" fill="#6cc49c"/>
  <polygon points="352,104 360,80 368,104" fill="#2f8f60"/>
  <polygon points="316,344 316,104 344,96 344,344" fill="#57bb8c"/>
  <polygon points="344,344 344,96 376,110 376,344" fill="#1f7a4d"/>

  <polygon points="384,344 384,156 410,150 410,344" fill="#4aad7e"/>
  <polygon points="410,344 410,150 436,166 436,344" fill="#27865a"/>

  <polygon points="442,344 442,196 468,190 468,344" fill="#3fa172"/>
  <polygon points="468,344 468,190 494,206 494,344" fill="#2a8a5f"/>

  <!-- pale blocks on the right, the hotel side -->
  <polygon points="500,344 500,214 532,208 532,344" fill="#8fd3b0"/>
  <polygon points="532,344 532,208 564,224 564,344" fill="#5cb98d"/>

  <polygon points="570,344 570,236 598,231 598,344" fill="#7ccda4"/>
  <polygon points="598,344 598,231 626,246 626,344" fill="#4aad7e"/>

  <polygon points="632,344 632,264 656,259 656,344" fill="#57bb8c"/>
  <polygon points="656,344 656,259 680,274 680,344" fill="#2f8f60"/>

  <!-- ===== Convention centre: long low block in front ===== -->
  <polygon points="252,346 252,300 268,292 424,286 424,346" fill="#2f8f60"/>
  <polygon points="424,346 424,286 486,300 486,346" fill="#1f7a4d"/>
  <polygon points="268,292 424,286 424,278 280,284" fill="#7ccda4"/>

  <!-- ===== Mid treeline: larger at the edges, smaller toward the centre ===== -->
  <g fill="#1a6b42">
    <polygon points="96,352 108,314 126,300 148,312 156,352"/>
    <polygon points="156,352 168,320 184,308 202,318 210,352"/>
    <polygon points="212,352 222,326 236,316 250,326 258,352"/>
    <polygon points="286,352 296,330 308,322 320,330 328,352"/>
    <polygon points="348,352 356,334 366,328 376,334 384,352"/>
    <polygon points="410,352 418,334 428,328 438,334 446,352"/>
    <polygon points="470,352 480,330 492,322 504,330 512,352"/>
    <polygon points="538,352 548,326 562,316 576,326 584,352"/>
    <polygon points="596,352 608,320 624,308 642,318 650,352"/>
    <polygon points="652,352 664,314 682,300 704,312 712,352"/>
  </g>

  <!-- ===== Ground ===== -->
  <polygon points="0,346 800,340 800,500 0,500" fill="#17603c"/>

  <!-- road receding toward the skyline -->
  <polygon points="392,352 414,352 584,500 214,500" fill="#cfe6d9"/>
  <g fill="#eef8f2">
    <polygon points="400,372 406,372 408,388 398,388"/>
    <polygon points="396,414 410,414 414,438 392,438"/>
    <polygon points="390,470 416,470 422,500 384,500"/>
  </g>

  <!-- overpass crossing the road -->
  <polygon points="120,382 680,374 680,398 120,406" fill="#2f8f60"/>
  <polygon points="120,374 680,366 680,376 120,384" fill="#57bb8c"/>

  <!-- ===== Foreground trees, framing both edges ===== -->
  <!-- left -->
  <polygon points="0,86 58,102 104,162 124,258 100,362 44,426 0,452" fill="#124e31"/>
  <polygon points="18,142 64,128 96,184 62,236 22,214" fill="#17603c"/>
  <polygon points="40,258 92,246 108,308 62,338" fill="#1a6b42"/>
  <polygon points="52,330 80,326 96,500 40,500" fill="#0d3d26"/>
  <!-- right -->
  <polygon points="800,104 742,120 696,180 676,276 700,378 756,436 800,460" fill="#124e31"/>
  <polygon points="782,160 736,146 704,202 738,254 778,232" fill="#17603c"/>
  <polygon points="760,276 708,264 692,326 738,356" fill="#1a6b42"/>
  <polygon points="748,348 720,344 704,500 760,500" fill="#0d3d26"/>
</svg>
