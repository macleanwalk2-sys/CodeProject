<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Low poly illustration of the downtown Raleigh, North Carolina skyline">

  <!-- ===== Sky, faceted ===== -->
  <rect width="800" height="500" fill="#f2faf6"/>
  <polygon points="0,0 320,0 0,190" fill="#e9f5ef"/>
  <polygon points="320,0 800,0 800,130 520,70" fill="#e4f2ea"/>
  <polygon points="0,190 320,0 500,160 0,330" fill="#eef8f2"/>
  <polygon points="800,130 800,300 520,175" fill="#e1f0e7"/>
  <polygon points="0,330 500,160 800,300 800,430 0,430" fill="#f2faf6"/>

  <!-- ===== Sun ===== -->
  <polygon points="640,40 701,75 701,145 640,180 579,145 579,75" fill="#dcf0e5"/>
  <polygon points="640,62 682,86 682,134 640,158 598,134 598,86" fill="#c9e7d7"/>

  <!-- ===== Skyline ===== -->
  <!-- far left low-rise -->
  <polygon points="40,430 40,305 75,299 75,430" fill="#4aad7e"/>
  <polygon points="75,430 75,299 110,312 110,430" fill="#2d8c62"/>

  <polygon points="112,430 112,262 142,255 142,430" fill="#46a87a"/>
  <polygon points="142,430 142,255 172,270 172,430" fill="#2a8a5f"/>

  <polygon points="180,430 180,205 219,198 219,430" fill="#3fa172"/>
  <polygon points="219,430 219,198 258,214 258,430" fill="#1f7a4d"/>

  <!-- stepped crown tower -->
  <polygon points="288,138 310,112 332,138" fill="#57bb8c"/>
  <polygon points="268,430 268,138 310,131 310,430" fill="#3fa172"/>
  <polygon points="310,430 310,131 352,148 352,430" fill="#23814f"/>

  <!-- tallest tower with sail crown -->
  <polygon points="416,92 420,58 424,92" fill="#17603c"/>
  <polygon points="366,150 418,92 418,142" fill="#57bb8c"/>
  <polygon points="418,92 470,150 418,142" fill="#2f8f60"/>
  <polygon points="366,430 366,150 418,142 418,430" fill="#43a97b"/>
  <polygon points="418,430 418,142 470,150 470,430" fill="#1f7a4d"/>

  <polygon points="480,430 480,176 514,169 514,430" fill="#3fa172"/>
  <polygon points="514,430 514,169 548,185 548,430" fill="#25835a"/>

  <polygon points="556,430 556,228 592,221 592,430" fill="#46a87a"/>
  <polygon points="592,430 592,221 628,238 628,430" fill="#2a8a5f"/>

  <polygon points="638,430 638,196 671,190 671,430" fill="#3fa172"/>
  <polygon points="671,430 671,190 704,206 704,430" fill="#23814f"/>

  <polygon points="712,430 712,268 742,262 742,430" fill="#4aad7e"/>
  <polygon points="742,430 742,262 772,278 772,430" fill="#2d8c62"/>

  <!-- ===== Faceted treeline ===== -->
  <polygon points="18,430 46,376 74,430" fill="#1a6b42"/>
  <polygon points="60,430 84,390 108,430" fill="#17603c"/>
  <polygon points="684,430 712,380 740,430" fill="#1a6b42"/>
  <polygon points="726,430 750,392 774,430" fill="#17603c"/>

  <!-- ===== Ground ===== -->
  <polygon points="0,430 800,422 800,500 0,500" fill="#15603b"/>
  <polygon points="0,468 800,454 800,500 0,500" fill="#0f4a30"/>

  <text x="400" y="486" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="15" fill="#bfe3d1" font-weight="600" letter-spacing="5">RALEIGH, NORTH CAROLINA</text>
</svg>
