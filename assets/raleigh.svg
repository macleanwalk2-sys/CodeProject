<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration of the Raleigh, North Carolina skyline">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#e4f2ea"/>
      <stop offset="0.55" stop-color="#f2f9f5"/>
      <stop offset="1"   stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b9160"/>
      <stop offset="1" stop-color="#1b6d44"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="646" cy="118" r="40" fill="#d3ecdf" opacity="0.85"/>
  <circle cx="646" cy="118" r="62" fill="#d3ecdf" opacity="0.35"/>

  <!-- ================= Far layer ================= -->
  <g fill="#cfe7d9">
    <rect x="24"  y="292" width="52" height="150"/>
    <rect x="86"  y="266" width="40" height="176"/>
    <rect x="136" y="308" width="60" height="134"/>
    <rect x="596" y="286" width="46" height="156"/>
    <rect x="650" y="262" width="38" height="180"/>
    <rect x="698" y="300" width="56" height="142"/>
    <rect x="762" y="280" width="30" height="162"/>
  </g>

  <!-- ================= Mid layer ================= -->
  <g fill="#a8d8c0">
    <!-- stepped tower -->
    <rect x="186" y="238" width="62" height="204"/>
    <rect x="198" y="220" width="38" height="26"/>
    <rect x="212" y="204" width="10" height="20"/>
    <!-- domed capitol -->
    <rect x="352" y="330" width="96" height="112"/>
    <path d="M366,330 A34,30 0 0 1 434,330 Z"/>
    <rect x="396" y="278" width="8" height="26"/>
    <path d="M386,304 A14,12 0 0 1 414,304 Z"/>
    <!-- right mid tower -->
    <rect x="536" y="252" width="56" height="190"/>
    <rect x="548" y="236" width="32" height="18"/>
  </g>

  <!-- ================= Front layer ================= -->
  <g fill="url(#front)">
    <!-- Left tower, flat top with mast -->
    <rect x="256" y="196" width="72" height="246"/>
    <rect x="284" y="164" width="8" height="34"/>

    <!-- Center tower with sail crown (PNC-inspired) -->
    <rect x="336" y="150" width="104" height="292" opacity="0"/>
    <path d="M336,214 L336,442 L440,442 L440,214 L412,150 L364,150 Z"/>

    <!-- Slim connector block -->
    <rect x="444" y="268" width="40" height="174"/>

    <!-- Right tower, stepped crown -->
    <rect x="490" y="228" width="78" height="214"/>
    <rect x="504" y="208" width="50" height="24"/>
    <rect x="520" y="190" width="18" height="20"/>
  </g>

  <!-- Windows -->
  <g fill="#eaf5ee" opacity="0.5">
    <!-- left tower -->
    <rect x="270" y="222" width="13" height="16"/><rect x="291" y="222" width="13" height="16"/><rect x="312" y="222" width="8" height="16"/>
    <rect x="270" y="252" width="13" height="16"/><rect x="291" y="252" width="13" height="16"/><rect x="312" y="252" width="8" height="16"/>
    <rect x="270" y="282" width="13" height="16"/><rect x="291" y="282" width="13" height="16"/><rect x="312" y="282" width="8" height="16"/>
    <rect x="270" y="312" width="13" height="16"/><rect x="291" y="312" width="13" height="16"/><rect x="312" y="312" width="8" height="16"/>
    <rect x="270" y="342" width="13" height="16"/><rect x="291" y="342" width="13" height="16"/><rect x="312" y="342" width="8" height="16"/>

    <!-- center tower -->
    <rect x="352" y="238" width="14" height="18"/><rect x="376" y="238" width="14" height="18"/><rect x="400" y="238" width="14" height="18"/><rect x="420" y="238" width="10" height="18"/>
    <rect x="352" y="272" width="14" height="18"/><rect x="376" y="272" width="14" height="18"/><rect x="400" y="272" width="14" height="18"/><rect x="420" y="272" width="10" height="18"/>
    <rect x="352" y="306" width="14" height="18"/><rect x="376" y="306" width="14" height="18"/><rect x="400" y="306" width="14" height="18"/><rect x="420" y="306" width="10" height="18"/>
    <rect x="352" y="340" width="14" height="18"/><rect x="376" y="340" width="14" height="18"/><rect x="400" y="340" width="14" height="18"/><rect x="420" y="340" width="10" height="18"/>
    <rect x="352" y="374" width="14" height="18"/><rect x="376" y="374" width="14" height="18"/><rect x="400" y="374" width="14" height="18"/><rect x="420" y="374" width="10" height="18"/>

    <!-- right tower -->
    <rect x="502" y="250" width="13" height="16"/><rect x="523" y="250" width="13" height="16"/><rect x="544" y="250" width="13" height="16"/>
    <rect x="502" y="280" width="13" height="16"/><rect x="523" y="280" width="13" height="16"/><rect x="544" y="280" width="13" height="16"/>
    <rect x="502" y="310" width="13" height="16"/><rect x="523" y="310" width="13" height="16"/><rect x="544" y="310" width="13" height="16"/>
    <rect x="502" y="340" width="13" height="16"/><rect x="523" y="340" width="13" height="16"/><rect x="544" y="340" width="13" height="16"/>

    <!-- connector -->
    <rect x="454" y="288" width="20" height="14"/>
    <rect x="454" y="314" width="20" height="14"/>
    <rect x="454" y="340" width="20" height="14"/>
  </g>

  <!-- Soft haze at the base for depth -->
  <rect x="0" y="360" width="800" height="82" fill="url(#fade)" opacity="0.55"/>

  <!-- Treeline -->
  <g fill="#1b6d44" opacity="0.9">
    <circle cx="60"  cy="432" r="20"/>
    <circle cx="92"  cy="436" r="16"/>
    <circle cx="128" cy="430" r="22"/>
    <circle cx="690" cy="432" r="19"/>
    <circle cx="722" cy="436" r="15"/>
    <circle cx="754" cy="430" r="21"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="442" width="800" height="58" fill="#15603b"/>
  <text x="400" y="478" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#cfeadd" font-weight="600" letter-spacing="4">RALEIGH, NORTH CAROLINA</text>
</svg>
