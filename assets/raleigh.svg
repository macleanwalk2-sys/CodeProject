<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Low poly illustration of the downtown Raleigh, North Carolina skyline">

  <!-- ===== Sky, faceted ===== -->
  <rect width="800" height="500" fill="#f4fbf7"/>
  <polygon points="0,0 300,0 0,175" fill="#e8f5ee"/>
  <polygon points="300,0 800,0 800,120 540,66" fill="#e3f1e9"/>
  <polygon points="0,175 300,0 520,150 0,320" fill="#eff8f3"/>
  <polygon points="800,120 800,285 540,165" fill="#e0efe6"/>

  <!-- ===== Skyline, left to right ===== -->

  <!-- low blocks at the far left -->
  <polygon points="86,436 86,300 118,294 118,436" fill="#4aad7e"/>
  <polygon points="118,436 118,294 150,308 150,436" fill="#2d8c62"/>
  <polygon points="152,436 152,262 180,256 180,436" fill="#46a87a"/>
  <polygon points="180,436 180,256 208,272 208,436" fill="#2a8a5f"/>

  <!-- Wells Fargo Capitol Center: pyramid roof and needle spire -->
  <polygon points="228,54 231,120 225,120" fill="#17603c"/>
  <polygon points="200,168 228,118 228,168" fill="#57bb8c"/>
  <polygon points="228,118 256,168 228,168" fill="#2f8f60"/>
  <polygon points="200,436 200,168 228,162 228,436" fill="#43a97b"/>
  <polygon points="228,436 228,162 256,176 256,436" fill="#1f7a4d"/>

  <!-- shoulder block -->
  <polygon points="258,436 258,232 282,226 282,436" fill="#3fa172"/>
  <polygon points="282,436 282,226 306,242 306,436" fill="#23814f"/>

  <!-- PNC Plaza: tallest, twin pronged crown -->
  <polygon points="322,110 330,72 338,110" fill="#57bb8c"/>
  <polygon points="356,110 364,78 372,110" fill="#2f8f60"/>
  <polygon points="316,436 316,110 344,102 344,436" fill="#4aad7e"/>
  <polygon points="344,436 344,102 378,116 378,436" fill="#1f7a4d"/>

  <!-- tower right of PNC -->
  <polygon points="392,436 392,158 420,151 420,436" fill="#43a97b"/>
  <polygon points="420,436 420,151 448,168 448,436" fill="#25835a"/>

  <!-- stepping down to the right -->
  <polygon points="458,436 458,206 486,200 486,436" fill="#3fa172"/>
  <polygon points="486,436 486,200 514,216 514,436" fill="#2a8a5f"/>

  <polygon points="520,436 520,238 548,232 548,436" fill="#4aad7e"/>
  <polygon points="548,436 548,232 576,248 576,436" fill="#23814f"/>

  <!-- pale blocks on the right -->
  <polygon points="584,436 584,222 616,216 616,436" fill="#8fd3b0"/>
  <polygon points="616,436 616,216 648,232 648,436" fill="#5cb98d"/>

  <polygon points="656,436 656,266 686,260 686,436" fill="#46a87a"/>
  <polygon points="686,436 686,260 716,276 716,436" fill="#2d8c62"/>

  <polygon points="722,436 722,292 748,287 748,436" fill="#4aad7e"/>
  <polygon points="748,436 748,287 774,300 774,436" fill="#2a8a5f"/>

  <!-- ===== Convention centre: long low block in front ===== -->
  <polygon points="236,436 236,352 400,344 400,436" fill="#2f8f60"/>
  <polygon points="400,436 400,344 470,356 470,436" fill="#1f7a4d"/>
  <polygon points="236,352 400,344 400,336 250,342" fill="#6cc49c"/>

  <!-- ===== Foreground tree masses ===== -->
  <polygon points="0,436 0,300 34,336 56,290 84,436" fill="#17603c"/>
  <polygon points="44,436 72,352 100,436" fill="#1a6b42"/>
  <polygon points="94,436 116,382 138,436" fill="#14563a"/>

  <polygon points="800,436 800,296 764,330 742,286 714,436" fill="#17603c"/>
  <polygon points="706,436 734,348 762,436" fill="#1a6b42"/>
  <polygon points="668,436 690,384 712,436" fill="#14563a"/>

  <!-- ===== Ground ===== -->
  <polygon points="0,436 800,428 800,500 0,500" fill="#15603b"/>
  <polygon points="0,470 800,456 800,500 0,500" fill="#0f4a30"/>

  <text x="400" y="488" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="15" fill="#bfe3d1" font-weight="600" letter-spacing="5">RALEIGH, NORTH CAROLINA</text>
</svg>
