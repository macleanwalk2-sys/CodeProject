<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Illustration of the Raleigh, North Carolina skyline">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf5ee"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e9e63"/>
      <stop offset="1" stop-color="#1f7a4d"/>
    </linearGradient>
    <linearGradient id="bldg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3aa76d"/>
      <stop offset="1" stop-color="#228554"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="640" cy="120" r="46" fill="#d9efe1"/>

  <!-- distant buildings -->
  <g fill="#bfe0cd">
    <rect x="60" y="300" width="70" height="180"/>
    <rect x="150" y="270" width="55" height="210"/>
    <rect x="640" y="290" width="80" height="190"/>
    <rect x="720" y="320" width="60" height="160"/>
  </g>

  <!-- mid buildings -->
  <g fill="url(#bldg2)">
    <rect x="210" y="230" width="80" height="250"/>
    <rect x="560" y="250" width="90" height="230"/>
  </g>

  <!-- main towers -->
  <g fill="url(#bldg)">
    <!-- PNC-style tower -->
    <rect x="330" y="140" width="110" height="340"/>
    <polygon points="330,140 385,90 440,140"/>
    <!-- second tower -->
    <rect x="450" y="185" width="95" height="295"/>
    <rect x="490" y="150" width="15" height="45"/>
  </g>

  <!-- windows -->
  <g fill="#eaf5ee" opacity="0.55">
    <rect x="348" y="170" width="14" height="18"/>
    <rect x="372" y="170" width="14" height="18"/>
    <rect x="396" y="170" width="14" height="18"/>
    <rect x="348" y="205" width="14" height="18"/>
    <rect x="372" y="205" width="14" height="18"/>
    <rect x="396" y="205" width="14" height="18"/>
    <rect x="348" y="240" width="14" height="18"/>
    <rect x="372" y="240" width="14" height="18"/>
    <rect x="396" y="240" width="14" height="18"/>
    <rect x="348" y="275" width="14" height="18"/>
    <rect x="372" y="275" width="14" height="18"/>
    <rect x="396" y="275" width="14" height="18"/>

    <rect x="466" y="210" width="13" height="16"/>
    <rect x="488" y="210" width="13" height="16"/>
    <rect x="510" y="210" width="13" height="16"/>
    <rect x="466" y="240" width="13" height="16"/>
    <rect x="488" y="240" width="13" height="16"/>
    <rect x="510" y="240" width="13" height="16"/>
    <rect x="466" y="270" width="13" height="16"/>
    <rect x="488" y="270" width="13" height="16"/>
    <rect x="510" y="270" width="13" height="16"/>
  </g>

  <!-- ground -->
  <rect x="0" y="480" width="800" height="80" fill="#15603b"/>
  <text x="400" y="527" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#eaf5ee" font-weight="700" letter-spacing="2">RALEIGH, NC</text>
</svg>
